[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.deps]
description = "Install node_modules from the lockfile"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
# 3000, not Astro's default: the Typesense cluster only allows this origin.
description = "Serve the docs with HMR on :3000"
depends = [":deps"]
run = "astro dev --port 3000"

[tasks.build]
description = "Build the static site into dist/"
depends = [":deps"]
run = "astro build"
sources = [
  "astro.config.mjs",
  "tsconfig.json",
  "package-lock.json",
  "content/**/*",
  "public/**/*",
  "src/**/*",
]
outputs = ["dist/**/*"]

[tasks.preview]
description = "Serve the built dist/ on :3000"
depends = [":build"]
run = "astro preview --port 3000"

[tasks.lint]
description = "Lint the docs sources with biome"
run = "flint run biome"

[tasks.fmt]
description = "Format the docs sources with biome"
run = "flint run --fix --allow-fixed biome"

[tasks.typecheck]
description = "Typecheck the astro components and .ts sources"
depends = [":deps"]
# astro sync and astro build both write .astro/, so never let them overlap.
wait_for = [":build"]
run = ["astro sync", "astro check"]

[tasks.test]
description = "Run the vitest unit suite"
depends = [":deps"]
run = "vitest run"

[tasks.check]
description = "Lint, typecheck, test and build the docs"
depends = [":lint", ":typecheck", ":test", ":build"]

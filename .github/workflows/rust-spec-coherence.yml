name: rust-spec-coherence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rust-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cmp hindclaw-docs/public/openapi.json vs hindclaw-clients/rust/openapi.json
        run: |
          if ! cmp hindclaw-docs/public/openapi.json hindclaw-clients/rust/openapi.json; then
            echo "Rust crate-local openapi.json is out of sync with hindclaw-docs/public/openapi.json." >&2
            echo "Run: bash scripts/generate-clients.sh" >&2
            exit 1
          fi

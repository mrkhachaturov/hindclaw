---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # A job block replaces the workflow's, so contents is repeated.
    permissions:
      contents: read # actions/checkout
      pull-requests: read # paths-filter reads the PR file list over the API
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      clients-ts: ${{ steps.filter.outputs.clients-ts }}
      clients-python: ${{ steps.filter.outputs.clients-python }}
      clients-rust: ${{ steps.filter.outputs.clients-rust }}
      clients-go: ${{ steps.filter.outputs.clients-go }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            extension:
              - 'hindclaw-extension/**'
            clients-ts:
              - 'hindclaw-clients/typescript/**'
              - 'hindclaw-docs/public/openapi.json'
            clients-python:
              - 'hindclaw-clients/python/**'
              - 'hindclaw-docs/public/openapi.json'
            clients-rust:
              - 'hindclaw-clients/rust/**'
              - 'hindclaw-docs/public/openapi.json'
            clients-go:
              - 'hindclaw-clients/go/**'
              - 'hindclaw-docs/public/openapi.json'
            docs:
              - 'hindclaw-docs/**'
            scripts:
              - 'scripts/**'
            ci:
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'mise.lock'
              - 'flint.toml'
              - 'hk.pkl'

  # Squash merges take the PR title as the commit subject, so it is the only
  # message that reaches main — and no git hook ever sees it.
  title:
    name: PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      # The title is attacker-controlled: it reaches the shell as an env var,
      # never as `${{ }}` inside the run block.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          hk run commit-msg "$RUNNER_TEMP/pr-title"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # No filter: flint's scope is every tracked file, so any path list here
    # would silently shrink it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run lint

  check-docs:
    name: Docs
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.docs == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run //hindclaw-docs:check
        env:
          PUBLIC_TYPESENSE_HOST: ${{ vars.PUBLIC_TYPESENSE_HOST }}
          PUBLIC_TYPESENSE_COLLECTION: ${{ vars.PUBLIC_TYPESENSE_COLLECTION }}
          PUBLIC_TYPESENSE_SEARCH_API_KEY: ${{ vars.PUBLIC_TYPESENSE_SEARCH_API_KEY }}

  check-extension:
    name: Extension
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.extension == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run //hindclaw-extension:check

  build-extension-python-versions:
    name: Extension wheel (py${{ matrix.python-version }})
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.extension == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: mise run //hindclaw-extension:build

  verify-openapi-spec:
    name: OpenAPI drift
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.extension == 'true' ||
      needs.detect-changes.outputs.docs == 'true' ||
      needs.detect-changes.outputs.scripts == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run //hindclaw-extension:deps
      - name: Regenerate OpenAPI spec
        run: bash scripts/generate-openapi.sh
      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain hindclaw-docs/public/openapi.json)" ]; then
            echo "hindclaw-docs/public/openapi.json is out of sync."
            echo ""
            git --no-pager diff hindclaw-docs/public/openapi.json | head -200
            echo ""
            echo "Run locally and commit:"
            echo "  bash scripts/generate-openapi.sh"
            echo "  bash scripts/generate-clients.sh"
            echo "  bash scripts/generate-docs-skill.sh"
            exit 1
          fi
          echo "OpenAPI spec is up to date."

  build-typescript-client:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-ts == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hindclaw-clients/typescript/package-lock.json
      - name: Install dependencies
        working-directory: hindclaw-clients/typescript
        run: npm ci
      - name: Build
        working-directory: hindclaw-clients/typescript
        run: npm run build

  test-typescript-client:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-ts == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hindclaw-clients/typescript/package-lock.json
      - name: Install dependencies
        working-directory: hindclaw-clients/typescript
        run: npm ci
      - name: Jest
        working-directory: hindclaw-clients/typescript
        run: npm test

  test-typescript-client-deno:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-ts == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hindclaw-clients/typescript/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install dependencies
        working-directory: hindclaw-clients/typescript
        run: npm ci
      - name: Deno smoke tests
        working-directory: hindclaw-clients/typescript
        run: npm run test:deno

  test-python-client:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-python == 'true' ||
      needs.detect-changes.outputs.extension == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install client with test extras
        working-directory: hindclaw-clients/python
        run: |
          uv venv --python 3.12 .venv
          uv pip install ".[test]"
      - name: Pytest
        working-directory: hindclaw-clients/python
        run: .venv/bin/python -m pytest tests/ -v

  test-rust-client:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-rust == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hindclaw-clients/rust/target
          key: ${{ runner.os }}-cargo-rust-client-${{ hashFiles('hindclaw-clients/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-client-
      - name: Build
        working-directory: hindclaw-clients/rust
        run: cargo build --locked
      - name: Test
        working-directory: hindclaw-clients/rust
        run: cargo test --locked

  test-go-client:
    needs: [detect-changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.clients-go == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache-dependency-path: hindclaw-clients/go/go.sum
      - name: Go test
        working-directory: hindclaw-clients/go
        run: go test ./... -v

  # The only required check. `detect-changes` is in needs on purpose: without
  # it, a failure there skips the rest and skipped alone would read as green.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - title
      - lint
      - check-docs
      - check-extension
      - build-extension-python-versions
      - verify-openapi-spec
      - build-typescript-client
      - test-typescript-client
      - test-typescript-client-deno
      - test-python-client
      - test-rust-client
      - test-go-client
    if: always()
    steps:
      - name: A job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

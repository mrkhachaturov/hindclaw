---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger the deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call the deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DOCS_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/webhook.out -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN")
          echo "webhook responded $code"
          cat /tmp/webhook.out
          test "$code" -lt 400
